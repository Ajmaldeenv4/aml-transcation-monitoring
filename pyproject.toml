[project]
name = "sentinel-aml"
version = "0.1.0"
description = "Sentinel AML — Transaction Monitoring & Alert Triage System (synthetic data only)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mohamed Ajmaldeen S" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.16",
    "streamlit>=1.33",
    "altair>=5.2",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
